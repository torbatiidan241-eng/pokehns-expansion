name: Build ROM

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential \
            libpng-dev \
            pkg-config \
            git \
            python3

      - name: Verify Tools and Environment
        run: |
          arm-none-eabi-gcc --version
          python3 --version

      - name: Run Pre-Build Patching (if required)
        run: |
          if [ -f "tools/map_section_patcher.py" ]; then
            python3 tools/map_section_patcher.py
          fi

      - name: Compile ROM
        run: |
          make -j$(nproc)

      - name: Archive Compiled ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poke-hns
          path: poke-hns.gba