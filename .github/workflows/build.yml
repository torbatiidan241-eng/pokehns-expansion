name: Build Updated Expansion ROM

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System & DevkitPro Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpng-dev \
            pkg-config \
            git \
            python3 \
            wget \
            gdebi-core

          # Install devkitPro pacman repository keyring
          sudo wget https://apt.devkitpro.org/devkitpro-keyring.deb
          sudo dpkg -i devkitpro-keyring.deb
          echo "deb https://apt.devkitpro.org stable main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
          sudo apt-get update

          # Install devkitARM toolchain and general tools
          sudo apt-get install -y --no-install-recommends \
            devkitpro-keyring \
            base-devkit-env \
            gba-dev

      - name: Set Environment Variables
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH

      - name: Verify Tools and Environment
        run: |
          arm-none-eabi-gcc --version
          python3 --version

      - name: Build Required Tools
        run: |
          if [ -d "tools" ]; then
            make -C tools
          fi

      - name: Run Pre-Build Patching (if required)
        run: |
          if [ -f "tools/map_section_patcher.py" ]; then
            python3 tools/map_section_patcher.py
          fi

      - name: Compile ROM
        run: |
          make -j$(nproc)

      - name: Archive Compiled ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poke-hns-updated
          path: poke-hns.gba