name: Build Updated Expansion ROM

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpng-dev \
            pkg-config \
            git \
            python3 \
            wget \
            curl

      - name: Setup devkitARM via GitHub Releases
        run: |
          sudo mkdir -p /opt/devkitpro/devkitARM
          
          # Download and extract the latest devkitARM release package directly
          REL_URL=$(curl -s https://api.github.com/repos/devkitPro/devkitARM-releases/releases/latest | grep "browser_download_url.*tar.xz" | cut -d '"' -f 4 | head -n 1)
          if [ -z "$REL_URL" ]; then
            # Fallback direct download link if API limit is hit
            REL_URL="https://github.com/devkitPro/devkitARM-releases/releases/download/r54-1/devkitARM-r54-1-linux.tar.xz"
          fi
          
          wget -q "$REL_URL" -O devkitarm.tar.xz
          sudo tar -xf devkitarm.tar.xz -C /opt/devkitpro/
          
          # Ensure uniform directory naming
          if [ -d "/opt/devkitpro/devkitARM" ] && [ ! "$(ls -A /opt/devkitpro/devkitARM)" ]; then
            sudo rm -rf /opt/devkitpro/devkitARM
            sudo mv /opt/devkitpro/devkitarm /opt/devkitpro/devkitARM || true
          fi

      - name: Set Environment Variables
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH

      - name: Verify Tools and Environment
        run: |
          arm-none-eabi-gcc --version
          python3 --version

      - name: Build Required Tools
        run: |
          if [ -d "tools" ]; then
            make -C tools
          fi

      - name: Run Pre-Build Patching (if required)
        run: |
          if [ -f "tools/map_section_patcher.py" ]; then
            python3 tools/map_section_patcher.py
          fi

      - name: Compile ROM
        run: |
          make -j$(nproc)

      - name: Archive Compiled ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poke-hns-updated
          path: poke-hns.gba
