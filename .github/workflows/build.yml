name: Build Updated Expansion ROM

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpng-dev \
            pkg-config \
            git \
            python3 \
            wget \
            curl \
            gdebi-core

      - name: Setup devkitPro Toolchain via GitHub Action
        uses: devkitPro/actions/install@v3

      - name: Verify Tools and Environment
        run: |
          arm-none-eabi-gcc --version
          python3 --version

      - name: Build Required Tools
        run: |
          if [ -d "tools" ]; then
            make -C tools
          fi

      - name: Run Pre-Build Patching (if required)
        run: |
          if [ -f "tools/map_section_patcher.py" ]; then
            python3 tools/map_section_patcher.py
          fi

      - name: Compile ROM
        run: |
          make -j$(nproc)

      - name: Archive Compiled ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poke-hns-updated
          path: poke-hns.gba
