name: Build Pokémon HnS

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev libsdl2-dev git wget curl

      - name: Downgrade GCC / Install GCC 11 & G++ 11
        run: |
          sudo apt-get install -y gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
          gcc --version

      - name: Install ARM Embedded Toolchain
        run: |
          wget https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2
          tar -xf gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2
          sudo mv gcc-arm-none-eabi-10.3-2021.10 /opt/gcc-arm-none-eabi
          echo "/opt/gcc-arm-none-eabi/bin" >> $GITHUB_PATH

      - name: Verify Toolchain
        run: |
          arm-none-eabi-gcc --version

      - name: Build ROM
        run: |
          make hns -j$(nproc)

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokehns-gba
          path: pokehns.gba
