name: Build Updated Expansion ROM

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpng-dev \
            pkg-config \
            git \
            python3 \
            wget \
            curl \
            lsb-release \
            software-properties-common \
            gnupg

      - name: Setup devkitPro Repository & Toolchain
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://apt.devkitpro.org/devkitpro-keyring.gpg | sudo tee /etc/apt/keyrings/devkitpro-keyring.gpg > /dev/null
          
          echo "deb [signed-by=/etc/apt/keyrings/devkitpro-keyring.gpg] https://apt.devkitpro.org stable main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
          
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            devkitpro-keyring \
            base-devkit-env \
            gba-dev

      - name: Set Environment Variables
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH

      - name: Verify Tools and Environment
        run: |
          arm-none-eabi-gcc --version
          python3 --version

      - name: Build Required Tools
        run: |
          if [ -d "tools" ]; then
            make -C tools
          fi

      - name: Run Pre-Build Patching (if required)
        run: |
          if [ -f "tools/map_section_patcher.py" ]; then
            python3 tools/map_section_patcher.py
          fi

      - name: Compile ROM
        run: |
          make -j$(nproc)

      - name: Archive Compiled ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poke-hns-updated
          path: poke-hns.gba
