name: Build Updated Expansion ROM

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential \
            libpng-dev \
            pkg-config \
            git \
            python3

      - name: Set Environment Variables
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH

      - name: Verify Tools and Environment
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:$PATH
          
          arm-none-eabi-gcc --version
          python3 --version

      - name: Build Required Tools (Conditional)
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:$PATH

          if [ -d "tools" ] && [ -f "tools/Makefile" ]; then
            make -C tools
          fi

      - name: Run Pre-Build Patching (if required)
        run: |
          if [ -f "tools/map_section_patcher.py" ]; then
            python3 tools/map_section_patcher.py
          fi

      - name: Compile ROM
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:$PATH

          make -j$(nproc)

      - name: Archive Compiled ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poke-hns-updated
          path: poke-hns.gba
